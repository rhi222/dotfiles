name: secret-scan

# lint.yml とは別のワークフローにしている。lint.yml は paths: ["**.sh"] で絞られており、
# Markdown だけの変更では発火しない。機密語は skill の説明文やドキュメントに入るので、
# スキャンは全ファイルの変更で走る必要がある。lint.yml の絞りを外すと、ドキュメント変更の
# たびに shellcheck が走って無駄になる。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CI は機密語辞書の実体を持てない（このリポジトリは public で、Actions のログも公開される）。
      # そのため社名を含まない汎用パターンだけの .example で走らせる。
      # 主の防壁は pre-commit hook 側で、こちらは push 後の最終防波堤。
      - name: Scan tracked files
        env:
          SECRET_PATTERNS: scripts/secret-patterns.txt.example
        run: bash scripts/secret-scan.sh --tree
