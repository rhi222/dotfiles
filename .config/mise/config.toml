[tools]
# 言語ランタイム
bun = "latest"
deno = "latest"
go = "latest"
java = "21"
node = "24"
python = { version = "latest", postinstall = "python -m pip install --upgrade boto3 pynvim requests" }
rust = "latest"

# パッケージマネージャ
"npm:pnpm" = "latest"
uv = "latest"

# Node製CLI（Node本体と分離してツール単位で更新）
"npm:@drawio/mcp" = "latest"
"npm:@github/copilot" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@mistweaverco/kulala-fmt" = "latest"
"npm:@openai/codex" = "latest"
"npm:aws-cdk" = "latest"
"npm:browser-sync" = "latest"
"npm:ccmanager" = "latest"
"npm:ccstatusline" = "latest"
"npm:ccusage" = "latest"
# 3.34.1はnpmのgitHeadと公式repositoryの同version commitを確認済み。
# 版を限定し、別versionでtrust evidenceが低下した場合は再びfailさせる。
"npm:difit" = { version = "latest", trust_policy_excludes = ["cytoscape@3.34.1"] }
"npm:neovim" = "latest"   # Neovim Node host。本体バイナリは aqua:neovim/neovim
"npm:npm-check-updates" = "latest"
"npm:prettier" = "latest"
"npm:wsl-open" = "latest"

# CLIツール（aquaバックエンドでプリビルドバイナリを取得）
aws = "latest"
bat = "latest"
bottom = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
delta = "latest"
gitui = "latest"
"aqua:neovim/neovim" = "latest"
ripgrep = "latest"
stylua = "latest"
tmux = "latest"
yazi = "latest"
zoxide = "latest"
yq = "latest"
herdr = "latest"

# GitHub Releasesからバイナリをインストール
# https://mise.jdx.dev/dev-tools/backends/github.html
"github:k1LoW/mo" = "latest"

# aquaバックエンドで管理するCLIツール（旧go install / npm / pip 経由から移行）
"aqua:jesseduffield/lazydocker" = "latest"
"aqua:jesseduffield/lazygit" = "latest"
"aqua:k1LoW/deck" = "latest"
"aqua:k1LoW/tcmux" = "latest"
"aqua:k1LoW/git-wt" = "latest"
"aqua:x-motemen/ghq" = "latest"
"aqua:mvdan/sh" = "latest"          # shfmt
"aqua:koalaman/shellcheck" = "latest"
"aqua:LuaLS/lua-language-server" = "latest"
"aqua:astral-sh/ruff" = "latest"
"aqua:biomejs/biome" = "latest"
"aqua:marp-team/marp-cli" = "latest"
"aqua:rvben/rumdl" = "latest"
"aqua:tree-sitter/tree-sitter" = "latest"
"aqua:modem-dev/hunk" = "latest"  # ターミナルdiffビューア

# pipxバックエンドで管理するPython製CLIツール（隔離環境にインストール）
"pipx:git-remote-codecommit" = "latest"  # AWS CodeCommitのgit remote helper
"pipx:python-lsp-server" = { version = "latest", extras = ["all"] }
"pipx:sqlfluff" = "latest"
"pipx:xmlformatter" = "latest"

# Go製CLI（Go本体と分離してツール単位で更新）
"go:golang.org/x/tools/cmd/goimports" = "latest"

[settings]
# Pythonはプリビルドバイナリを強制（WSL2でコンパイル回避）
python.compile = false

# lockfileでバージョンを記録（再現性向上）
lockfile = true
lockfile_platforms = ["linux-x64"]

# リリース直後の壊れた版・yank される版を掴まないための枯らし期間。
# mise デフォルトは 24h だが、より安全側に 48h へ延長する。
minimum_release_age = "48h"

# idiomatic version files を尊重（repo 単位で pin できる）
# Go は .go-version だけを尊重し、非推奨の go.mod 読み取りは無効化する。
idiomatic_version_file_enable_tools = [
  "go",
  "node",
  "python",
]
idiomatic_version_file_disable_files = [
  "go:go.mod",
]
